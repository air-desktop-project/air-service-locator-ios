# CI d'air-service-locator-ios.
#
# # DEUX JOBS, ET LE SECOND N'EST PAS ENCORE HONNÊTE
#
# Le gate DCO tourne sur `ubuntu-latest` : il ne compile rien, et lui payer un
# runner macOS — dix fois le prix en minutes — serait absurde.
#
# La construction, elle, exige macOS et Xcode. **Elle est câblée mais elle ne
# construit rien de significatif** : le dépôt porte une arborescence, un point
# d'entrée et un type. C'est délibéré — un workflow ajouté APRÈS coup se découvre
# cassé le jour où l'on en a besoin, alors que celui-ci grandira avec le code
# qu'il juge.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'partage' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dco:
    name: DCO et paternité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Déterminer la base de comparaison
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            case "$base" in
              0000000000000000000000000000000000000000) base="" ;;
            esac
            if [ -n "$base" ] && ! git rev-parse --verify --quiet "$base" >/dev/null; then
              base=""
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: check-dco
        run: ./scripts/check-dco.sh "${{ steps.base.outputs.base }}"

  construction:
    name: xcodegen et build simulateur
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # Le `.xcodeproj` n'est PAS versionné (cf. `.gitignore`). Il se régénère
      # ici, ce qui vérifie du même coup que `project.yml` est valide — un
      # contrôle que rien d'autre ne fait.
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      # `-destination` VISE UN SIMULATEUR, ET PAS UN APPAREIL : la construction
      # pour un appareil réel exige une identité de signature, que la CI n'a pas
      # et ne doit pas avoir. Ce job vérifie que le code COMPILE, jamais qu'il
      # est signable.
      #
      # `CODE_SIGNING_ALLOWED=NO` le dit explicitement plutôt que de compter sur
      # le défaut du simulateur, qui a déjà changé d'une version d'Xcode à
      # l'autre.
      - name: Build
        run: |
          xcodebuild build \
            -project AirServiceLocator.xcodeproj \
            -scheme AirServiceLocator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
