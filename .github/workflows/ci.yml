# CI d'air-service-locator-ios.
#
# # DEUX JOBS
#
# Le gate DCO tourne sur `ubuntu-latest` : il ne compile rien, et lui payer un
# runner macOS — dix fois le prix en minutes — serait absurde.
#
# La construction, elle, exige macOS et Xcode : elle construit le transport
# (le xcframework du dépôt client), régénère le projet, compile pour le
# simulateur, et lance les essais.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'partage' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dco:
    name: DCO et paternité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Déterminer la base de comparaison
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            case "$base" in
              0000000000000000000000000000000000000000) base="" ;;
            esac
            if [ -n "$base" ] && ! git rev-parse --verify --quiet "$base" >/dev/null; then
              base=""
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: check-dco
        run: ./scripts/check-dco.sh "${{ steps.base.outputs.base }}"

  construction:
    name: xcodegen et build simulateur
    runs-on: macos-15
    # `project.yml` lie `../air-service-locator-client/target/mobile/…` : les
    # deux dépôts sont donc extraits CÔTE À CÔTE, et chaque étape de l'app
    # se place dans le sien.
    defaults:
      run:
        working-directory: air-service-locator-ios
    steps:
      - uses: actions/checkout@v5
        with:
          path: air-service-locator-ios

      # LE TRANSPORT EST CONSTRUIT ICI, DEPUIS LE DÉPÔT CLIENT, À UN SHA
      # ÉPINGLÉ. Un xcframework n'est pas commis — c'est une sortie — et une
      # branche bougerait sous nos pieds. Avancer le SHA est un commit de ce
      # dépôt, relu comme un autre ; c'est la même règle que le dépôt client
      # applique aux crates du serveur.
      - uses: actions/checkout@v5
        with:
          repository: air-desktop-project/air-service-locator-client
          ref: 9d97bde1ce1ebdae78acfa53877c0acc6c5a806d
          path: air-service-locator-client

      # La toolchain est CELLE DU DÉPÔT CLIENT (`rust-toolchain.toml`), lue
      # plutôt que recopiée ici : deux copies vieilliraient, une en silence.
      - name: Toolchain Rust et cibles iOS
        working-directory: air-service-locator-client
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "toolchain : $toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim \
            --toolchain "$toolchain"

      # Le cache porte sur le SHA du client : tant qu'il ne bouge pas, la pile
      # QUIC ne se recompile pas trois fois par run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            air-service-locator-client/target
          key: transport-ios-${{ runner.os }}-9d97bde1ce1ebdae78acfa53877c0acc6c5a806d

      - name: Transport (xcframework)
        working-directory: air-service-locator-client
        run: ./scripts/construire-mobile.sh ios

      # Le `.xcodeproj` n'est PAS versionné (cf. `.gitignore`). Il se régénère
      # ici, ce qui vérifie du même coup que `project.yml` est valide — un
      # contrôle que rien d'autre ne fait.
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      # `-destination` VISE UN SIMULATEUR, ET PAS UN APPAREIL : la construction
      # pour un appareil réel exige une identité de signature, que la CI n'a pas
      # et ne doit pas avoir. Ce job vérifie que le code COMPILE, jamais qu'il
      # est signable.
      #
      # LA DESTINATION EST GÉNÉRIQUE, ET C'EST UNE CORRECTION : `name=iPhone 16`
      # a cassé le jour où l'image du runner a cessé d'embarquer ce modèle —
      # « Unable to find a device matching the provided destination
      # specifier ». Un nom de modèle est une dépendance sur l'image, qui change
      # sans nous prévenir ; `generic/platform=iOS Simulator` compile pour le
      # simulateur sans en nommer aucun.
      #
      # `CODE_SIGNING_ALLOWED=NO` le dit explicitement plutôt que de compter sur
      # le défaut du simulateur, qui a déjà changé d'une version d'Xcode à
      # l'autre.
      - name: Build
        run: |
          xcodebuild build \
            -project AirServiceLocator.xcodeproj \
            -scheme AirServiceLocator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Les essais, eux, ont besoin d'un simulateur QUI DÉMARRE, donc d'un
      # modèle. On le demande à l'image plutôt que de le supposer : le premier
      # iPhone disponible, quel que soit son nom.
      - name: Essais
        run: |
          simulateur=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].name')
          echo "simulateur : $simulateur"
          xcodebuild test \
            -project AirServiceLocator.xcodeproj \
            -scheme AirServiceLocator \
            -destination "platform=iOS Simulator,name=$simulateur" \
            CODE_SIGNING_ALLOWED=NO
