# Définition du projet Xcode d'air-service-locator — pour XcodeGen.
#
# # POURQUOI CE FICHIER PLUTÔT QU'UN `.xcodeproj`
#
# Un `.xcodeproj` est un répertoire de XML généré, que deux branches ne savent
# pas fusionner : chaque fichier ajouté y écrit un identifiant de 24 caractères,
# et deux ajouts parallèles produisent un conflit que personne ne sait relire.
# Ce fichier-ci se relit, se compare et se fusionne comme du code.
#
#     xcodegen generate     # produit AirServiceLocator.xcodeproj, non versionné
#
# Le `.xcodeproj` est dans `.gitignore` : c'est une SORTIE, au même titre qu'un
# binaire.
#
# # CE QUI EST DÉCIDÉ ICI
#
# L'identifiant d'application est ARRÊTÉ : `org.airdesktop.servicelocator`. Il
# suit l'organisation `air-desktop-project` plutôt qu'un domaine de produit —
# c'est le nom sous lequel les trois dépôts vivent déjà, et celui qui ne dépendra
# pas d'une bascule de domaine. Un identifiant ne se change plus une fois qu'un
# profil de provisionnement et un enregistrement App Store Connect l'ont figé ;
# le fixer maintenant est la seule occasion de le faire sans coût.
#
# IL EST ÉCRIT EN TOUTES LETTRES sur la cible, et pas déduit de `bundleIdPrefix`.
# XcodeGen compose autrement le préfixe et le NOM DE LA CIBLE, ce qui donnerait
# `org.airdesktop.AirServiceLocator` — donc un identifiant qui changerait le jour
# où l'on renommerait la cible. Un identifiant figé ne doit dépendre de rien
# qu'on puisse renommer.
#
# `deploymentTarget` iOS 17 : rien ici n'exige encore une version aussi récente.
# C'est un défaut, pas une conclusion — à revoir contre le parc réellement visé.

name: AirServiceLocator

options:
  bundleIdPrefix: org.airdesktop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Le mode strict de la concurrence Swift 6. Coûteux à adopter tard, gratuit
    # à adopter maintenant : il n'y a pas encore de code à corriger.
    SWIFT_STRICT_CONCURRENCY: complete
    # Un avertissement non traité est une régression qui attend son heure —
    # la même règle que le `RUSTFLAGS: -D warnings` du dépôt serveur.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  AirServiceLocator:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.airdesktop.servicelocator
    sources:
      - path: Sources
        # Les notes de répertoire ne sont pas des ressources de l'application.
        # Sans cette exclusion, XcodeGen les range dans la phase « Copy Bundle
        # Resources » et elles partent dans l'`.ipa` livrée.
        excludes:
          - "**/README.md"
          # Les réglages de l'annuaire de TEST (adresse, nom, racine PEM) sont
          # propres à un réseau et ne sont pas versionnés ; s'ils sont absents,
          # l'application tourne sur le banc en mémoire. Voir `README.md`.
    info:
      path: Sources/Ressources/Info.plist
      properties:
        CFBundleDisplayName: Service Locator
        UILaunchScreen: {}
        # ── LA PHRASE QUE L'UTILISATEUR LIT AVANT DE POSER SON DOIGT ────────
        #
        # iOS l'affiche dans l'alerte système, et REFUSE DE LANCER
        # l'application si elle manque alors que le binaire lie
        # `LocalAuthentication`. Ce n'est donc pas une politesse, c'est une
        # condition de démarrage.
        NSFaceIDUsageDescription: >-
          Votre identité est confirmée sur cet appareil pour autoriser l'accès à
          vos machines et à vos services. Aucune donnée biométrique ne quitte
          l'appareil.
        # ── LA CAMÉRA NE SERT QU'À LIRE UN CODE ─────────────────────────────
        #
        # Le seul usage : lire le QR code que l'autre téléphone affiche pour
        # enrôler un second appareil. Aucune image n'est gardée ni envoyée ;
        # la caméra se ferme dès que le code est lu. Sans permission, le même
        # code se colle dans un champ texte.
        NSCameraUsageDescription: >-
          La caméra sert uniquement à lire le code affiché par votre autre
          téléphone pour l'enrôler sur ce compte. Aucune image n'est conservée.
    dependencies:
      - sdk: LocalAuthentication.framework
      # ── LE TRANSPORT, EN XCFRAMEWORK, DEPUIS LE DÉPÔT CLIENT ──────────────
      #
      # `asl-client-ffi` construit pour iOS et le simulateur, avec `asl.h` et sa
      # carte de module (`import CAsl`). Il est PRODUIT par
      # `scripts/construire-mobile.sh` du dépôt `air-service-locator-client`,
      # cloné à côté de celui-ci, et n'est versionné nulle part : c'est une
      # sortie. `embed: false` parce que c'est une bibliothèque statique — elle
      # entre dans le binaire, il n'y a rien à copier dans l'`.app`.
      - framework: ../air-service-locator-client/target/mobile/AslClient.xcframework
        embed: false

  AirServiceLocatorTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.airdesktop.servicelocator.essais
    sources:
      - path: Tests/AirServiceLocatorTests
    dependencies:
      - target: AirServiceLocator
